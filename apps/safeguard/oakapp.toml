identifier = "com.example.apps.safeguard"
app_version = "1.0.0"
entrypoint = ["/entrypoint.sh", "python3", "-u", "/app/backend/src/main.py"]

prepare_container = [
    { type = "COPY", source = "./backend/requirements.txt", target = "./backend/requirements.txt" },
    { type = "RUN", command = "python3 -m pip install -r /app/backend/requirements.txt --break-system-packages" },
]

prepare_build_container = [
    { type = "RUN", command = "bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash && . \"$HOME/.nvm/nvm.sh\" && nvm install 24.14.1'" },
]

depthai_models = { yaml_path = "./backend/src/depthai_models" }

[static_frontend]
dist_path = "./frontend/dist"

[static_frontend.build]
source_path = "./frontend"
steps = [
    "bash -c 'cd /app/frontend && export NODE_OPTIONS=--max-old-space-size=4096 && . $HOME/.nvm/nvm.sh && npm ci && npm run build'",
]

[env]
DEPTHAI_AUTOCALIBRATION = "OFF"
PYTHONUNBUFFERED = "1"

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "luxonis/oakapp-base"
image_name = "luxonis/oakapp-base"
image_tag = "1.3.0-py311"
