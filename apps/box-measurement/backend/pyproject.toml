[tool.mypy]
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["depthai_nodes.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["open3d", "cv2"]
ignore_missing_imports = true

# BoxDimensioner.process keeps two named parameters, as solutions-sdk host
# nodes do; the line carries pyright's rule-specific ignore. A `# type: ignore`
# there would also silence every pyright rule on the line, so mypy's override
# check is disabled for this module here instead.
[[tool.mypy.overrides]]
module = ["solutions_sdk.box_measurement.node.dimensioning.box_dimensioner"]
disable_error_code = ["override"]
