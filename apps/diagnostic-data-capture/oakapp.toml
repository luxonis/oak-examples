identifier = "com.example.apps.diagnostic-data-capture"
app_version = "1.0.0"
entrypoint = ["bash", "/app/standalone.sh"]
assign_frontend_port = true

prepare_container = [
    { type = "COPY", source = "./requirements.txt", target = "./requirements.txt" },
    { type = "RUN", command = "python3.12 -m pip install -r /app/requirements.txt ${DEPTHAI_VERSION:+depthai==$DEPTHAI_VERSION} --break-system-packages" },
]

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "luxonis/oakapp-base"
image_name = "luxonis/oakapp-base"
image_tag = "1.3.0"
