identifier = "com.luxonis.custom-frontend.open-vocabulary-object-detection"
entrypoint = ["/entrypoint.sh", "bash", "/app/backend-run.sh"]
app_version = "1.0.3"

prepare_container = [
    { type = "COPY", source = "./backend/requirements.txt", target = "./backend/requirements.txt" },
    # default python3: the NPU base image ships onnxruntime(-qnn) for it
    { type = "RUN", command = "python3 -m pip install -r /app/backend/requirements.txt --break-system-packages"},
]

prepare_build_container = [{type = "RUN", command = "bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash && . \"$HOME/.nvm/nvm.sh\" && nvm install 24'"}]
build_steps = []

depthai_models = { yaml_path = "./backend/src/depthai_models" }

# NPU (Hexagon HTP) passthrough for the ONNX Runtime QNN EP.
optional_devices = [
    "/dev/fastrpc-cdsp",
    "/dev/adsprpc-smd",
    "/dev/dma_heap/qcom,system",
    "/dev/dma_heap/system",
]
optional_mounts = ["/opt/luxonis/npu-runtime:/opt/luxonis/npu-runtime:ro,rbind"]
allowed_devices = [{ allow = true, access = "rw" }]

[static_frontend]
dist_path = "./frontend/dist"

[static_frontend.build]
source_path = "./frontend"
steps = ["bash -c 'cd /app/frontend/src && export NODE_OPTIONS=--max-old-space-size=4096 && . $HOME/.nvm/nvm.sh && npm install && npm run build'"]

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "luxonis/oakapp-base"
image_name = "luxonis/oakapp-base"
image_tag = "1.2.9-onnxruntime"
