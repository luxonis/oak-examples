name: Publish OAK App

on:
  workflow_dispatch:
    inputs:
      root_dir:
        description: "Path to the example root containing oakapp.toml."
        type: string
        required: true
      new_identifier:
        description: "Override identifier. Otherwise com.example.<top-level-folder> becomes com.luxonis"
        type: string
        required: false
  workflow_call:
    inputs:
      root_dir:
        description: "Path to the example root containing oakapp.toml."
        type: string
        required: true
      new_identifier:
        description: "Override identifier. Otherwise com.example.<top-level-folder> becomes com.luxonis"
        type: string
        default: ""
        required: false
    secrets:
      GITLAB_TOKEN:
        required: true
      OAKCTL_HUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ['self-hosted', 'testbed-runner']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install HIL
        run: |
          pip install hil_framework --upgrade --no-cache-dir --index-url https://__token__:${{ secrets.GITLAB_TOKEN }}@gitlab.luxonis.com/api/v4/projects/213/packages/pypi/simple

      - name: Publish app via HIL runner
        env:
          ROOT_DIR: ${{ inputs.root_dir }}
          NEW_IDENTIFIER: ${{ inputs.new_identifier }}
          OAKCTL_HUB_TOKEN: ${{ secrets.OAKCTL_HUB_TOKEN }}
        run: |
          set -euo pipefail
          app_slug="${ROOT_DIR//\//-}"
          reservation_name="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#publish-oakapp-${app_slug}"

          ENV_VARS="\
            --env ROOT_DIR=$ROOT_DIR \
            --env NEW_IDENTIFIER=$NEW_IDENTIFIER \
            --env OAKCTL_HUB_TOKEN=$OAKCTL_HUB_TOKEN"

          exec hil_runner --models "oak4_pro or oak4_d" --reservation-name "$reservation_name" --wait --oakctl --sync-workspace \
            --dockerfile ./.github/ci/publish_oakapp/Dockerfile \
            --docker-run-args "$ENV_VARS"

      - name: Record result
        if: ${{ always() }}
        env:
          ROOT_DIR: ${{ inputs.root_dir }}
          PUBLISH_RESULT: ${{ job.status }}
        run: |
          {
            echo "### $ROOT_DIR"
            echo
            echo "Result: $PUBLISH_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
