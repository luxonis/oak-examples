identifier = "com.example.object-detection.yolo-world"
app_version = "1.0.0"

prepare_container = [
    { type = "COPY", source = "requirements.txt", target = "requirements.txt" },
    # the base image ships python3 + pip (and onnxruntime/-qnn preinstalled)
    { type = "RUN", command = "python3 -m pip install -r /app/requirements.txt --break-system-packages" },
]

prepare_build_container = []

build_steps = []

depthai_models = { yaml_path = "./depthai_models" }

entrypoint = ["/entrypoint.sh", "python3.12", "-u", "/app/main.py"]

# NPU (Hexagon HTP) passthrough for the ONNX Runtime QNN EP.
optional_devices = [
    "/dev/fastrpc-cdsp",
    "/dev/adsprpc-smd",
    "/dev/dma_heap/qcom,system",
    "/dev/dma_heap/system",
]
optional_mounts = ["/opt/luxonis/npu-runtime:/opt/luxonis/npu-runtime:ro,rbind"]
allowed_devices = [{ allow = true, access = "rw" }]

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "luxonis/oakapp-base"
image_name = "luxonis/oakapp-base"
image_tag = "1.4.0-onnxruntime"
