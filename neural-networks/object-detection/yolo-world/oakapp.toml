identifier = "com.example.object-detection.yolo-world"
app_version = "1.0.0"

prepare_container = [
    { type = "RUN", command = "apt-get update" },
    { type = "RUN", command = "apt-get install -y python3-pip" },
    { type = "COPY", source = "requirements.txt", target = "requirements.txt" },
    { type = "RUN", command = "pip3 install -r /app/requirements.txt --break-system-packages" },
]

prepare_build_container = []

build_steps = []

depthai_models = { yaml_path = "./depthai_models" }

entrypoint = ["/entrypoint.sh", "bash", "-c", "python3 -u /app/main.py"]

# NPU (Hexagon HTP) passthrough so the CLIP text encoder runs on the DSP via
# the ONNX Runtime QNN EP. FastRPC libs, the /dev/fastrpc-cdsp alias and
# onnxruntime(-qnn) come preinstalled in the base image below.
optional_devices = [
    "/dev/adsprpc-smd",
    "/dev/dma_heap/qcom,system",
    "/dev/dma_heap/system",
]
# oak-agent mounts optional_devices but does not add device-cgroup allow
# rules for them (adsprpc-smd is char 496:*, dma_heap is char 248:*):
allowed_devices = [
    { allow = true, type = "c", major = 496, access = "rwm" },
    { allow = true, type = "c", major = 248, access = "rw" },
]

# ONNX Runtime (NPU) oakapp-base variant, served from the registry running
# on the device itself (oakapp-base branch: onnxruntime-base).
[base_image]
api_url = "http://127.0.0.1:5555"
image_name = "oakapp-base"
image_tag = "onnxruntime"